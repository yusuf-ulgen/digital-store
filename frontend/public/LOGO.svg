<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#888888;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#444444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a3a3a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left Text: ÜLGEN -->
  <text
    x="8"
    y="62"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="42"
    font-weight="700"
    letter-spacing="3"
    fill="url(#textGrad)"
  >ÜLGEN</text>

  <!-- Right Text: PASLANMAZ -->
  <text
    x="228"
    y="62"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="28"
    font-weight="700"
    letter-spacing="2"
    fill="url(#textGrad)"
  >PASLANMAZ</text>

  <!-- Knife 1: top-left to bottom-right (blade top-left, handle bottom-right) -->
  <!-- Blade -->
  <polygon
    points="168,12 185,14 213,52 205,56"
    fill="url(#bladeGrad)"
  />
  <!-- Handle -->
  <rect
    x="208" y="52" width="6" height="28"
    rx="3"
    transform="rotate(33, 211, 66)"
    fill="url(#handleGrad)"
  />
  <!-- Bolster -->
  <rect
    x="204" y="50" width="10" height="6"
    rx="1"
    transform="rotate(33, 209, 53)"
    fill="#555"
  />

  <!-- Knife 2: top-right to bottom-left (blade top-right, handle bottom-left) -->
  <!-- Blade -->
  <polygon
    points="250,12 235,14 208,52 215,56"
    fill="url(#bladeGrad)"
  />
  <!-- Handle -->
  <rect
    x="204" y="52" width="6" height="28"
    rx="3"
    transform="rotate(-33, 207, 66)"
    fill="url(#handleGrad)"
  />
  <!-- Bolster -->
  <rect
    x="205" y="50" width="10" height="6"
    rx="1"
    transform="rotate(-33, 210, 53)"
    fill="#555"
  />

  <!-- Center crossing dot (X center) -->
  <circle cx="209" cy="47" r="3" fill="#888" />

  <!-- Thin separator lines -->
  <line x1="0" y1="80" x2="420" y2="80" stroke="#e0e0e0" stroke-width="0.5" />
</svg>
